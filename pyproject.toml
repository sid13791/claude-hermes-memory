[project]
name = "hermes-memory"
version = "0.1.0"
description = "Hermes-style persistent memory for Claude Code: a shared notebook loaded into every session"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
hermes-memory = "hermes_memory.cli:main"
hermes-memory-server = "hermes_memory.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
